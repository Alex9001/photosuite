# Build and verify all native candidates before creating a draft release.
name: PhotoSuite

on:
  # Every branch is checked on push. Pull requests are checked too, but only
  # from forks — a branch in this repository has already run on its own push,
  # and running both would double every job.
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: photosuite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-js:
    name: Lint and test (JavaScript)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      # The suite imports modules that load vendor scripts from the submodules.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run vendor:fixlinks
      - run: npm run verify
      - run: npm test
      - run: python3 -m unittest discover -s tests/packaging -p 'test_*.py'

  build:
    name: Build (${{ matrix.label }})
    needs: check-js
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-15-intel
            platform: macos-x86_64
            rust_target: x86_64-apple-darwin
          - label: macOS Apple Silicon
            os: macos-14
            platform: macos-arm64
            rust_target: aarch64-apple-darwin
          - label: Windows x64
            os: windows-2025
            platform: windows-x64
            rust_target: x86_64-pc-windows-msvc
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu

    # The `secrets` context cannot be read from a step-level `if`, so the guard
    # value is lifted to the job environment and the steps test `env.` instead.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      # src/index.html script-loads UPNG, UZIP, pako, PDFI and friends straight
      # out of their submodule working trees, so a shallow checkout builds an app
      # whose vendor <script> tags all 404.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libcups2-dev \
            build-essential \
            file \
            patchelf \
            rpm zsync xvfb xdotool desktop-file-utils appstream

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      # Restores the placeholder files that dangling vendor symlinks point at.
      - name: Repair vendor symlinks
        run: npm run vendor:fixlinks

      # Apple secrets, all optional — set every one of them to get a signed and
      # notarized .dmg, set none to get an unsigned one:
      #   APPLE_CERTIFICATE           base64 of a Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  that .p12's export password
      #   KEYCHAIN_PASSWORD           any string; unlocks the throwaway keychain
      #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_API_KEY_P8            base64 of the App Store Connect .p8 key
      #   APPLE_API_KEY_ID            that key's ID
      #   APPLE_API_ISSUER            the issuer UUID
      - name: Set up Apple code signing
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          # A dedicated keychain added to the search list, rather than replacing
          # the runner's default one, so nothing else on the runner is disturbed.
          KEYCHAIN="$RUNNER_TEMP/photosuite-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          # Tauri notarizes only when all three are present. APPLE_API_KEY is the
          # key *ID*; the .p8 itself is referenced by path.
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      - name: Prepare AppImage update channel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          echo "LDAI_UPDATE_INFORMATION=gh-releases-zsync|$owner|$repository|latest|PhotoSuite-*-linux-x86_64.AppImage.zsync" >> "$GITHUB_ENV"

      - name: Use ad-hoc signing for unsigned macOS candidates
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY == ''
        shell: bash
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Tauri build (locked dependencies)
        run: npx tauri build --target ${{ matrix.rust_target }} -- --locked

      - name: Stage packages and source receipt
        run: python scripts/package-release.py stage ${{ matrix.platform }} dist

      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        run: bash scripts/verify-appimage.sh dist

      - name: Verify Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1

      - name: Verify macOS application architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          binary="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/PhotoSuite.app/Contents/MacOS/photosuite"
          file "$binary"
          if [[ '${{ matrix.platform }}' == 'macos-arm64' ]]; then
            lipo "$binary" -verify_arch arm64
          else
            lipo "$binary" -verify_arch x86_64
          fi
          codesign --verify --deep --strict "$(dirname "$(dirname "$binary")")/.."
          hdiutil verify dist/*.dmg
          unzip -t dist/*.zip
          python3 scripts/verify-macos.py

      - name: Retain native startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-evidence-${{ matrix.platform }}
          path: evidence/
          if-no-files-found: ignore

      - name: Upload PhotoSuite-${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSuite-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  catalog:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DISPLAY: ':99'
      IS_PULLREQUEST: 'true'
      STRICT: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          name: PhotoSuite-linux-x86_64
          path: candidates
      - name: Record candidate identity
        run: sha256sum candidates/*.AppImage > candidate-sha256.txt
      - name: Check out pinned upstream catalog worker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: AppImage/appimage.github.io
          ref: f1249e9e1ff840dd53a6218aec3451ebd6bf476d
          path: catalog
      - name: Install upstream worker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sudo imagemagick libasound2-dev pulseaudio-utils alsa-utils alsa-oss libjack0 desktop-file-utils xmlstarlet xsel xterm xvfb icewm x11-utils x11-apps netpbm xdotool libgl1-mesa-dri libgl1-mesa-dev mesa-utils libosmesa6 libsdl1.2-dev libsdl2-2.0-0 fonts-wqy-microhei libfile-mimeinfo-perl tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-ara tesseract-ocr-rus tesseract-ocr-ell libfuse2 stalonetray
          cd catalog
          bash code/fetch-deps.sh
          cp -a deps/. .
          sudo bash code/prep-dummy-soundcard.sh
          sudo gem install dupervisor -v 1.0.5
          sudo npm install -g asar
      - name: Run unmodified catalog worker against candidate bytes
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          python3 -m http.server 8765 --bind 127.0.0.1 --directory candidates > server.log 2>&1 &
          Xvfb :99 -screen 0 800x600x24 > xvfb.log 2>&1 &
          mkdir -p "$HOME/.icewm"
          echo 'ShowTaskBar = 0' > "$HOME/.icewm/preferences"
          sleep 2
          cd catalog
          echo "http://127.0.0.1:8765/PhotoSuite-$VERSION-linux-x86_64.AppImage" > data/PhotoSuite
          timeout --kill-after=30 600 bash -e code/worker.sh "$PWD/data/PhotoSuite" 2>&1 | tee ../catalog.log
          cmp BeingTested.AppImage "../candidates/PhotoSuite-$VERSION-linux-x86_64.AppImage"
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: appimage-catalog-evidence
          path: |
            catalog.log
            candidate-sha256.txt
            catalog/database/PhotoSuite/
            catalog/failure-screens/
            server.log
            xvfb.log

  verify-release:
    name: Verify complete release inventory
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: PhotoSuite-*
          path: dist
          merge-multiple: true
      - name: Check every package and exact source revision
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag does not match the application version" >&2
            exit 1
          fi
          python3 scripts/package-release.py verify dist --source "$GITHUB_SHA" --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-release, catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to modify a published release"'
            python3 - <<'PYCODE'
          import json
          from pathlib import Path
          existing = {asset['name'] for asset in json.load(open('release.json'))['assets']}
          expected = {path.name for path in Path('dist').iterdir()}
          assert existing <= expected, f'Draft has stale assets; review them before retrying: {existing - expected}'
          PYCODE
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --verify-tag --title "PhotoSuite $GITHUB_REF_NAME" \
              --generate-notes --draft dist/*
          fi
          # Validate the uploaded bytes, not merely the local staging directory.
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded
          version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          python3 scripts/package-release.py verify downloaded --source "$GITHUB_SHA" --version "$version"
