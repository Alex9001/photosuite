# PhotoSuite CI: lint the JS tree, then bundle installers on GitHub-hosted runners.
#
# Artifacts per run:
#   PhotoSuite-macos            universal (arm64 + x86_64) .dmg
#   PhotoSuite-windows          x64 NSIS .exe installer
#   PhotoSuite-linux-deb        x64 .deb
#   PhotoSuite-linux-rpm        x64 .rpm
#   PhotoSuite-linux-appimage   x64 .AppImage plus its .zsync update control file
#   PhotoSuite-linux-flatpak    x64 single-file .flatpak bundle
#   PhotoSuite-linux-pacman     x64 .pkg.tar.zst
#   PhotoSuite-linux-arm64-deb  arm64 .deb
#   PhotoSuite-linux-arm64-rpm  arm64 .rpm
#
# The Linux side is split in two: `build-linux` compiles the binary once per
# architecture and `package-linux` fans out one runner per package format. The
# Rust build is by far the expensive part, so compiling once and sharing the
# binary as a short-lived artifact is what keeps the fan-out cheap -- seven
# independent `tauri build` runs would pay for the same compile seven times
# over.
#
# arm64 ships as .deb and .rpm only. Those two cover the distributions people
# actually run on arm64 hardware, and every extra format doubles a packaging
# leg for a platform whose other bundlers (AppImage's runtime, the Flatpak
# runtime, makepkg's container image) each need their own arm64 story.
#
# Installers are only built for a `v*` tag push (or a manual workflow_dispatch run),
# not on a plain push to main. A tag push additionally publishes those files to a
# draft GitHub Release.
#
# macOS signing and notarization are opt-in: without the Apple secrets the job
# still builds and produces an unsigned .dmg. See "Apple secrets" below.

name: PhotoSuite

on:
  # Every branch is checked on push. Pull requests are checked too, but only
  # from forks — a branch in this repository has already run on its own push,
  # and running both would double every job.
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: photosuite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-js:
    name: Lint and test (JavaScript)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      # The suite imports modules that load vendor scripts from the submodules.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run vendor:fixlinks
      - run: npm run verify
      - run: npm test

  # Installers are built only for a release tag or a run started by hand.
  # A push to main (or any other branch) gets the checks above and stops there.
  #
  # macOS and Windows bundle in one job each: their bundlers run on the same
  # runner that compiled the binary and there is only one installer format per
  # platform, so there is nothing to fan out. These run in parallel with
  # build-linux and package-linux.
  build-desktop:
    name: Build (${{ matrix.label }})
    needs: check-js
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            os: macos-latest
            artifact: PhotoSuite-macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            bundle_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

          - label: Windows x64
            os: windows-latest
            artifact: PhotoSuite-windows
            rust_targets: ''
            tauri_args: ''
            bundle_paths: |
              src-tauri/target/release/bundle/nsis/*.exe

    # The `secrets` context cannot be read from a step-level `if`, so the guard
    # value is lifted to the job environment and the steps test `env.` instead.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      # src/index.html script-loads UPNG, UZIP, pako, PDFI and friends straight
      # out of their submodule working trees, so a shallow checkout builds an app
      # whose vendor <script> tags all 404.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      # Restores the placeholder files that dangling vendor symlinks point at.
      - name: Repair vendor symlinks
        run: npm run vendor:fixlinks

      # Apple secrets, all optional — set every one of them to get a signed and
      # notarized .dmg, set none to get an unsigned one:
      #   APPLE_CERTIFICATE           base64 of a Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  that .p12's export password
      #   KEYCHAIN_PASSWORD           any string; unlocks the throwaway keychain
      #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_API_KEY_P8            base64 of the App Store Connect .p8 key
      #   APPLE_API_KEY_ID            that key's ID
      #   APPLE_API_ISSUER            the issuer UUID
      - name: Set up Apple code signing
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          # A dedicated keychain added to the search list, rather than replacing
          # the runner's default one, so nothing else on the runner is disturbed.
          KEYCHAIN="$RUNNER_TEMP/photosuite-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          # Tauri notarizes only when all three are present. APPLE_API_KEY is the
          # key *ID*; the .p8 itself is referenced by path.
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      # `--target` is a tauri flag; putting it after `--` would hand it to cargo
      # and leave the bundler looking in the wrong target directory.
      - name: Tauri build
        run: npx tauri build ${{ matrix.tauri_args }} -- --locked

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error

  # Compiles the Linux binary once. Every package format in `package-linux` then
  # bundles from this one binary instead of recompiling, which is what makes the
  # fan-out below worth doing.
  build-linux:
    name: Build (Linux ${{ matrix.arch }})
    needs: check-js
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than 24.04 on purpose: a binary linked against glibc
          # 2.39 refuses to start on anything older, which rules out Debian 12,
          # Ubuntu 22.04 and RHEL 9 -- including Raspberry Pi OS on the arm64
          # side. Compiling on 22.04 puts the floor at glibc 2.35 for every
          # package built from these binaries, and running on a newer system is
          # forward compatible.
          #
          # This runner image retires with 22.04's standard support in April
          # 2027. The replacement is to compile inside an `ubuntu:22.04`
          # container on a current runner, which keeps the same floor without
          # depending on the runner image.
          - arch: x64
            os: ubuntu-22.04

          # GitHub's hosted arm64 runner, so this is a native build rather than
          # a cross-compile -- the webkit and CUPS headers it links against are
          # the arm64 ones from the runner's own apt.
          - arch: arm64
            os: ubuntu-22.04-arm
    steps:
      # src/index.html script-loads UPNG, UZIP, pako, PDFI and friends straight
      # out of their submodule working trees, so a shallow checkout builds an app
      # whose vendor <script> tags all 404.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Compile-time dependencies only. The libraries the *bundlers* need are
      # installed in package-linux instead.
      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libcups2-dev \
            build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # The runner label: each architecture needs a key of its own, and
          # the baseline is part of it because objects compiled against a
          # different glibc must not be reused.
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      # Restores the placeholder files that dangling vendor symlinks point at.
      - name: Repair vendor symlinks
        run: npm run vendor:fixlinks

      # The frontend is embedded into the binary by tauri::generate_context!, so
      # everything the bundlers need is in this one file.
      - name: Tauri build (no bundle)
        run: npx tauri build --no-bundle -- --locked

      - name: Upload linux-binary-${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary-${{ matrix.arch }}
          path: src-tauri/target/release/photosuite
          if-no-files-found: error
          # Purely an intermediate handoff to package-linux; nothing needs it
          # once the run is over.
          retention-days: 1

  # One runner per Linux package format, all fed from the binary built above, so
  # the Linux leg costs one compile plus the slowest single package rather than
  # the sum of all five. fail-fast is off: a broken Flatpak runtime or AppImage
  # tool download should not take the .deb and .rpm down with it.
  package-linux:
    name: Package (${{ matrix.label }})
    needs: build-linux
    # Each leg bundles on a runner of the architecture it packages: the deb and
    # rpm bundlers stamp the package architecture from the host they run on, so
    # an arm64 package built on an x64 runner would be labelled amd64.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux .deb
            arch: x64
            os: ubuntu-24.04
            format: deb
            bundles: deb
            artifact: PhotoSuite-linux-deb
            paths: src-tauri/target/release/bundle/deb/*.deb

          - label: Linux .rpm
            arch: x64
            os: ubuntu-24.04
            format: rpm
            bundles: rpm
            artifact: PhotoSuite-linux-rpm
            paths: src-tauri/target/release/bundle/rpm/*.rpm

          # On the same 22.04 baseline as the compile: linuxdeploy copies the
          # webkit and GTK libraries off this runner into the AppImage, so
          # bundling on 24.04 would put glibc 2.39 libraries around a glibc 2.35
          # binary and undo the portability gained above. The other legs declare
          # dependencies or repackage, and embed nothing from their host.
          - label: Linux AppImage
            arch: x64
            os: ubuntu-22.04
            format: appimage
            bundles: appimage
            artifact: PhotoSuite-linux-appimage
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.zsync

          # Tauri's bundler has no flatpak or pacman target, so these two
          # legs bundle a .deb and repackage its payload. Doing that here
          # rather than depending on the .deb leg keeps all five independent.
          - label: Linux Flatpak
            arch: x64
            os: ubuntu-24.04
            format: flatpak
            bundles: deb
            artifact: PhotoSuite-linux-flatpak
            paths: dist/flatpak/*.flatpak

          - label: Linux .pkg.tar.zst
            arch: x64
            os: ubuntu-24.04
            format: pacman
            bundles: deb
            artifact: PhotoSuite-linux-pacman
            paths: dist/pacman/*.pkg.tar.zst

          # arm64 stops at the two native package formats; see the note at the
          # top of this file.
          - label: Linux arm64 .deb
            arch: arm64
            os: ubuntu-24.04-arm
            format: deb
            bundles: deb
            artifact: PhotoSuite-linux-arm64-deb
            paths: src-tauri/target/release/bundle/deb/*.deb

          - label: Linux arm64 .rpm
            arch: arm64
            os: ubuntu-24.04-arm
            format: rpm
            bundles: rpm
            artifact: PhotoSuite-linux-arm64-rpm
            paths: src-tauri/target/release/bundle/rpm/*.rpm

    env:
      # GitHub runners have no FUSE, so linuxdeploy and appimagetool have to
      # unpack themselves instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      # Submodules are deliberately skipped: the frontend is already compiled
      # into the binary, and the only files the bundlers read from the tree are
      # src-tauri/ plus the LICENSE and THIRD-PARTY-NOTICES.md resources.
      - uses: actions/checkout@v7

      - name: Install Linux bundling dependencies
        run: |
          set -euo pipefail
          sudo apt-get update

          # patchelf and file are used by the deb/AppImage bundlers; the runtime
          # webkit libraries are what linuxdeploy copies into the AppImage.
          packages=(
            file
            patchelf
            libwebkit2gtk-4.1-0
            libayatana-appindicator3-1
            librsvg2-2
            libxdo3
          )
          case "${{ matrix.format }}" in
            rpm) packages+=(rpm) ;;
            flatpak) packages+=(flatpak flatpak-builder) ;;
            # scripts/verify-appimage.sh validates the desktop entry and the
            # AppStream metadata, and rebuilds the image from its own .zsync.
            appimage) packages+=(zsync desktop-file-utils appstream) ;;
          esac

          sudo apt-get install --no-install-recommends -y "${packages[@]}"

      # No compilation happens here, but the Tauri CLI reads `cargo metadata` to
      # locate the target directory and the binary name, so cargo has to be on
      # PATH. Installed explicitly rather than relying on the runner image.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      # Only needed for the Tauri CLI itself, which does the bundling.
      - run: npm ci

      - name: Download linux-binary-${{ matrix.arch }}
        uses: actions/download-artifact@v8
        with:
          name: linux-binary-${{ matrix.arch }}
          path: src-tauri/target/release

      # Artifact archives do not carry file modes, so the binary comes back
      # without its executable bit.
      - name: Restore the executable bit
        run: chmod +x src-tauri/target/release/photosuite

      # linuxdeploy-plugin-appimage reads this and hands appimagetool `-u`, which
      # both embeds the update information in the AppImage and writes the .zsync
      # control file beside it. Doing it this way rather than running zsyncmake
      # afterwards is what makes delta updates discoverable: the
      # `gh-releases-zsync` transport resolves the newest published release
      # through the GitHub API, so the channel does not go stale when the
      # version in the filename changes.
      #
      # The filename is a glob because it carries the version; it has to match
      # the asset the release actually publishes, which
      # scripts/verify-appimage.sh asserts.
      - name: Point the AppImage update channel at the latest release
        if: matrix.format == 'appimage'
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          echo "LDAI_UPDATE_INFORMATION=gh-releases-zsync|$owner|$repository|latest|PhotoSuite_*_amd64.AppImage.zsync" \
            >> "$GITHUB_ENV"

      # `tauri bundle` reuses the binary that `tauri build --no-bundle` left in
      # the target directory rather than compiling again.
      - name: Tauri bundle (${{ matrix.bundles }})
        run: npx tauri bundle -b ${{ matrix.bundles }}

      - name: Verify AppImage
        if: matrix.format == 'appimage'
        run: bash scripts/verify-appimage.sh src-tauri/target/release/bundle/appimage

      - name: Build Flatpak bundle
        if: matrix.format == 'flatpak'
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")

          # The manifest refers to its .deb source by a fixed name, since
          # flatpak-builder sources cannot be globbed.
          cp src-tauri/target/release/bundle/deb/*.deb packaging/flatpak/photosuite.deb

          flatpak --user remote-add --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47

          # rofiles-fuse needs FUSE, which the runners do not provide.
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo build-dir \
            packaging/flatpak/app.photosuite.PhotoSuite.yml

          mkdir -p dist/flatpak
          flatpak build-bundle flatpak-repo \
            "dist/flatpak/PhotoSuite_${version}_x86_64.flatpak" \
            app.photosuite.PhotoSuite

      - name: Build Arch package
        if: matrix.format == 'pacman'
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")

          work="$RUNNER_TEMP/pacman"
          mkdir -p dist/pacman "$work"
          cp packaging/arch/PKGBUILD packaging/arch/photosuite.install "$work/"
          cp src-tauri/target/release/bundle/deb/*.deb "$work/photosuite.deb"
          sed -i "s/^pkgver=.*/pkgver=${version}/" "$work/PKGBUILD"

          # makepkg exists only on Arch and refuses to run as root, so it runs
          # in a container as an unprivileged user. --nodeps skips the runtime
          # dependency check: none of the app's libraries are installed here and
          # repackaging the .deb payload does not need them.
          docker run --rm -v "$work:/pkg" archlinux:base-devel bash -c '
            set -euo pipefail
            useradd -m builder
            cp -r /pkg /home/builder/build
            chown -R builder:builder /home/builder/build
            su builder -c "cd /home/builder/build && makepkg --nodeps --noconfirm"
            cp /home/builder/build/*.pkg.tar.zst /pkg/
          '

          mv "$work"/*.pkg.tar.zst dist/pacman/

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The pattern excludes the intermediate `linux-binary-*` artifacts, which
      # must not end up as release assets.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: PhotoSuite-*
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Flatten nested subdirectories created by actions/download-artifact (e.g. deb/, rpm/)
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete

          # If the release was already created (e.g. on retry or prior partial run), upload assets directly
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, uploading assets..."
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*
          else
            echo "Creating draft release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PhotoSuite $GITHUB_REF_NAME" \
              --generate-notes \
              --draft \
              dist/*
          fi
