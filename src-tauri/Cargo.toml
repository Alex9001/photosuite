[package]
name = "photosuite"
version = "0.9.16"
description = "PhotoSuite - Advanced Image Editor"
authors = ["eolix"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "photosuite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
# On Linux, use xdg-desktop-portal rather than rfd's GTK3 backend.  The portal
# delegates to the active desktop's file chooser (KDE, GNOME, etc.); it has no
# effect on the plugin's native Windows and macOS backends.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.16"
tauri-plugin-store = "2.5.0"

[profile.release]
panic = "abort"
codegen-units = 4
lto = false
opt-level = 1
strip = false

[target."cfg(unix)".dependencies]
# 0.3.0 hardcodes `i8` for C strings and does not compile on aarch64. Pinned to
# the first upstream commit after the 0.3.0 tag, which only fixes those casts;
# replace with a plain version once a newer release is published.
cups_rs = { git = "https://github.com/Gmin2/cups-rs", rev = "d56e4495ad7885f268bb0ec8b511cb83543d695b" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Foundation"] }
winprint = "0.2.1"
